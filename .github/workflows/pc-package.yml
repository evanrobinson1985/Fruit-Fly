name: Fruit Fly for Windows (PC package)

# Builds a zip for Windows: Install.cmd puts the game in %LOCALAPPDATA%\FruitFly with a
# desktop shortcut; FruitFly.ps1 serves the site locally and opens it in its own window.
# The site's three.js is bundled (watch/phone/vendor), so it runs offline.

on:
  push:
    branches: [claude/quirky-wozniak-5060bj]
    paths: ["web/**", "pc/**", "watch/phone/vendor/**", ".github/workflows/pc-package.yml"]
  workflow_dispatch:

permissions:
  contents: write   # publish the pc-latest release (the PC app updates itself from it)

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the launcher script parses
        shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/pc/FruitFly.ps1", [ref]$null, [ref]$e) | Out-Null
          $e | ForEach-Object { Write-Host "::error::FruitFly.ps1: $_" }
          if ($e.Count) { exit 1 }
      - name: Assemble the package
        run: |
          set -e
          P=FruitFly-PC
          mkdir -p $P/FruitFly/site
          cp pc/Install.cmd pc/README.txt $P/
          cp pc/FruitFly.ps1 pc/fly.ico $P/FruitFly/
          cp -r web/index.html web/src web/assets $P/FruitFly/site/
          cp -r watch/phone/vendor $P/FruitFly/site/
          # frog models the page no longer loads
          rm -f $P/FruitFly/site/assets/frogs.glb $P/FruitFly/site/assets/frogs-animated.glb $P/FruitFly/site/assets/frogs-rigged.glb
          # three.js from the bundled copy instead of the CDN
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js#/vendor/three/build/three.module.js#; s#https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/#/vendor/three/examples/jsm/#' $P/FruitFly/site/index.html
          grep -q '/vendor/three/build/three.module.js' $P/FruitFly/site/index.html
          test -f $P/FruitFly/site/vendor/three/examples/jsm/libs/basis/basis_transcoder.wasm
          test -f $P/FruitFly/site/assets/frogs-original.glb
          echo "${{ github.run_number }}" > $P/FruitFly/version.txt
          # Every file with its SHA-256 and download URL: the app updates by fetching only
          # the files that changed. A copy goes in the package for its first update.
          python3 pc/make-manifest.py $P/FruitFly "${{ github.repository }}" "${{ github.sha }}" "${{ github.run_number }}" > pc-manifest.json
          cp pc-manifest.json $P/FruitFly/manifest.json
          cp $P/FruitFly/site/index.html pc-index.html
          du -sh $P
      - uses: actions/upload-artifact@v4
        with:
          name: fruit-fly-pc
          path: FruitFly-PC
          if-no-files-found: error
      # The desktop app updates itself from this release (pc/FruitFly.ps1): it compares
      # pc-version.txt with its own version.txt and, if newer, downloads the files that
      # pc-manifest.json says have changed (FruitFly-PC.zip if that fails).
      - name: Publish to the pc-latest release
        if: github.ref_name == 'claude/quirky-wozniak-5060bj'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -q -r FruitFly-PC.zip FruitFly-PC
          echo "${{ github.run_number }}" > pc-version.txt
          git tag -f pc-latest
          git push -f origin pc-latest
          gh release view pc-latest >/dev/null 2>&1 || gh release create pc-latest --prerelease \
            --title "Fruit Fly for Windows (latest)" \
            --notes "Updated by every build. Unzip and run Install.cmd; after that the desktop app updates itself from here."
          gh release upload pc-latest FruitFly-PC.zip pc-index.html pc-manifest.json --clobber
          # last: the version number apps check, once everything it points to is in place
          gh release upload pc-latest pc-version.txt --clobber
