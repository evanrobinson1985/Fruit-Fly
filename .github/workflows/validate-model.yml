name: Validate biological and browser simulation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  python-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install model dependencies
        run: python -m pip install -r requirements.txt
      - name: Run model regression tests
        run: python -m pytest -q

  browser-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser module syntax
        run: |
          node --input-type=module --check < web/src/main.js
          node --input-type=module --check < web/src/predators.js
      - name: Inspect uploaded frog rigs and animation clips
        run: node web/tools/inspect_frog_glb.mjs
      - name: Compare browser engine against validation probes
        run: node web/tools/check_engine.mjs
