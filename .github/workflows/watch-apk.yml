name: Feed the Fly (Wear OS APK)

on:
  push:
    paths:
      - "watch/**"
      - ".github/workflows/watch-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test brain and game logic
        working-directory: watch
        run: ./gradlew :brain:test --console=plain
      - name: Build APK
        working-directory: watch
        run: ./gradlew :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: feed-the-fly-apk
          path: watch/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
