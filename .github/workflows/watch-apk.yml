name: Feed the Fly (Wear OS and phone APKs)

on:
  push:
    paths:
      - "watch/**"
      - ".github/workflows/watch-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test brain and game logic
        working-directory: watch
        run: ./gradlew :brain:test --console=plain
      - name: Build APKs
        working-directory: watch
        run: ./gradlew :app:assembleRelease :phone:assembleRelease --console=plain
      - name: Name the APKs
        run: |
          mkdir -p out
          cp watch/app/build/outputs/apk/release/app-release.apk out/feed-the-fly-watch.apk
          cp watch/phone/build/outputs/apk/release/phone-release.apk out/feed-the-fly-phone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: feed-the-fly-apk
          path: out/feed-the-fly-watch.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: feed-the-fly-phone-apk
          path: out/feed-the-fly-phone.apk
          if-no-files-found: error
