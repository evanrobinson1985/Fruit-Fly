name: Feed the Fly (Wear OS and phone APKs)

on:
  push:
    paths:
      - "watch/**"
      - "web/**"            # the phone app packs the website
      - ".github/workflows/watch-apk.yml"
  pull_request:
    paths:
      - "watch/**"
      - "web/**"            # test the combined phone/watch changes before merging
      - ".github/workflows/watch-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # publish the phone-latest release (in-app updates)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test brain and game logic
        working-directory: watch
        run: ./gradlew :brain:test --console=plain
      - name: Build APKs
        working-directory: watch
        run: ./gradlew :app:assembleRelease :phone:assembleRelease --console=plain
      - name: Verify phone APK contains the website and frog model
        run: |
          APK=watch/phone/build/outputs/apk/release/phone-release.apk
          unzip -Z1 "$APK" | grep -Fx "assets/web/src/main.js"
          unzip -Z1 "$APK" | grep -Fx "assets/web/assets/frogs-original.glb"
          unzip -Z1 "$APK" | grep -Fx "assets/web/assets/env/stones.glb"
          unzip -Z1 "$APK" | grep -Fx "assets/web/vendor/three/examples/jsm/libs/basis/basis_transcoder.wasm"
          unzip -Z1 "$APK" | grep -Fx "assets/web/vendor/three/build/three.module.js"
          unzip -Z1 "$APK" | grep -Fx "assets/web/vendor/three/examples/jsm/controls/OrbitControls.js"
          unzip -Z1 "$APK" | grep -Fx "assets/web/vendor/three/examples/jsm/utils/BufferGeometryUtils.js"
          unzip -Z1 "$APK" | grep -Fx "assets/web/vendor/three/examples/jsm/utils/SkeletonUtils.js"
          unzip -Z1 "$APK" | grep -Fx "assets/web/vendor/three/examples/jsm/loaders/GLTFLoader.js"
          echo "Verified: phone page, frog model, and all required Three.js modules are packaged."
      - name: Name the APKs
        run: |
          mkdir -p out
          cp watch/app/build/outputs/apk/release/app-release.apk out/feed-the-fly-watch.apk
          cp watch/phone/build/outputs/apk/release/phone-release.apk out/feed-the-fly-phone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: feed-the-fly-apk
          path: out/feed-the-fly-watch.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: feed-the-fly-phone-apk
          path: out/feed-the-fly-phone.apk
          if-no-files-found: error
      # The phone app updates itself from this release (watch/phone/.../Updater.kt): it reads
      # phone-version.txt (this build's versionCode, 100 + run number) and downloads the APK.
      - name: Publish to the phone-latest release
        if: github.event_name != 'pull_request' && github.ref_name == 'claude/quirky-wozniak-5060bj'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo $(( 100 + ${{ github.run_number }} )) > out/phone-version.txt
          git tag -f phone-latest
          git push -f origin phone-latest
          gh release view phone-latest >/dev/null 2>&1 || gh release create phone-latest --prerelease \
            --title "Feed the Fly for Android (latest)" \
            --notes "Updated by every build. The phone app checks here for updates. Watch APK included."
          gh release upload phone-latest out/feed-the-fly-phone.apk out/feed-the-fly-watch.apk out/phone-version.txt --clobber
