<!doctype html>
<meta charset="utf-8">
<title>Feed the Fly scenery renderer</title>
<!-- Renders the website's grass arena (web/src/terrain.js: GPU grass, weeds and their skins)
     as a side-view strip for the watch game, at the same scale and viewing angle as the fly
     sprites (sprites.html). Two layers: everything behind the fly's path, and the grass in
     front of it (drawn over the fly). Driven by watch/tools/render_scenery.mjs; serve the
     repository's web/ folder as the root. -->
<body style="margin:0;background:transparent">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { Terrain, TURF_TOP } from "/src/terrain.js";

// The strip: the fly walks along world y = Y0 from x = X0 - SPAN to X0 + SPAN (game stage
// x = world x - X0). Pixels per mm, and how far below and above the path the strip reaches.
const P = 40, X0 = 0, Y0 = 0, SPAN = 37, BELOW = 5, ABOVE = 20;
// Same view direction as the sprite camera, minus its slight three-quarter turn: looking along
// +y, 17 degrees down.
const DIR = new THREE.Vector3(0, 10.5, -3.2).normalize();

const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(16, 16);
r.toneMapping = THREE.ACESFilmicToneMapping;
r.shadowMap.enabled = true;
r.shadowMap.type = THREE.PCFSoftShadowMap;
r.localClippingEnabled = true;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
scene.add(new THREE.HemisphereLight(0xfff3e0, 0x302820, 0.7));
const sun = new THREE.DirectionalLight(0xfff0dd, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 80 });
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

const terrain = new Terrain(scene, 100);
// Keep the fly's path clear of weeds: move any that would stand on it to either side.
const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
for (const mesh of terrain.weedMeshes) {
  for (let i = 0; i < mesh.count; i++) {
    mesh.getMatrixAt(i, m);
    m.decompose(p, q, s);
    const clear = 2.6 * s.x + 1.2;
    if (Math.abs(p.x - X0) < SPAN + 10 && Math.abs(p.y - Y0) < clear) {
      p.y = Y0 + Math.sign(p.y - Y0 || 1) * clear;
      m.compose(p, q, s);
      mesh.setMatrixAt(i, m);
    }
  }
  mesh.instanceMatrix.needsUpdate = true;
}
terrain.bake(r);
terrain.visible = true;
// No fly to press the grass, no wind.
terrain.update(X0, Y0, 0, 1000, 0, 0);

// Three layers. "near": the grass and weeds up to NEAR mm behind the path; "front": the grass
// in front of it (drawn over the fly); both orthographic strips at P px/mm that scroll with
// the stage. "far": everything beyond NEAR, one wide perspective view with the sprites' optics,
// scrolled with parallax (what lies NEAR mm behind the fly moves D / (D + NEAR) as fast).
const NEAR = 8;
// Keep y > a: Plane((0, 1, 0), -a); keep y < b: Plane((0, -1, 0), b).
const above = (a) => new THREE.Plane(new THREE.Vector3(0, 1, 0), -a), below = (b) => new THREE.Plane(new THREE.Vector3(0, -1, 0), b);
const FRONT = 3.5; // only low grass this close in front of the path is drawn over the fly
const planes = {
  near: { plants: [above(Y0 + 0.25), below(Y0 + NEAR)], floor: [above(Y0 - FRONT), below(Y0 + NEAR)] },
  front: { plants: [above(Y0 - FRONT), below(Y0 - 0.3)], floor: [above(Y0 - FRONT - 30), below(Y0 - FRONT)] },
  far: { plants: [above(Y0 + NEAR)], floor: [above(Y0 + NEAR)] },
};
scene.fog = new THREE.Fog(0x0d0c0a, 60, 260);
const UP = new THREE.Vector3(0, 0, 1).sub(DIR.clone().multiplyScalar(DIR.z)).normalize();
const W = Math.round(2 * SPAN * P), H = Math.round((BELOW + ABOVE) * P), TILE = 1024;
const D = 11.16, PARALLAX = D / (D + NEAR);
const FAR_W = Math.round(2 * (SPAN * PARALLAX + 9) * P);
// Rows in each image of the ground line NEAR mm behind the path, where the layers meet.
const seam = { near: 0, far: 0 };
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
ortho.up.set(0, 0, 1);
const persp = new THREE.PerspectiveCamera(60, 1, 0.1, 600);
persp.up.set(0, 0, 1);

function setLayer(layer) {
  for (const mt of [terrain.blades.material, ...terrain.weedMeshes.map((w) => w.material)]) { mt.clippingPlanes = planes[layer].plants; mt.needsUpdate = true; }
  terrain.floor.material.clippingPlanes = planes[layer].floor;
  terrain.floor.material.needsUpdate = true;
  // Weeds stand behind the path only, so they never hide the fly.
  for (const w of terrain.weedMeshes) w.visible = layer !== "front";
  scene.background = layer === "far" ? new THREE.Color(0x0d0c0a) : null;
  r.setClearColor(0x000000, 0);
}

window.render = (layer) => {
  setLayer(layer);
  const tiles = [];
  if (layer === "far") {
    // One shot from the sprite camera's position over the middle of the path; focal length set
    // so the seam is drawn at P px/mm, like the near strip.
    const F = P * (D + NEAR);
    const target = new THREE.Vector3(X0, Y0, TURF_TOP + 1.0);
    persp.position.copy(target).addScaledVector(DIR, -D);
    persp.lookAt(target);
    const FULL = 8000;
    persp.fov = 2 * Math.atan(FULL / 2 / F) * 180 / Math.PI;
    persp.aspect = 1;
    persp.clearViewOffset();
    persp.updateProjectionMatrix();
    persp.updateMatrixWorld();
    const v = new THREE.Vector3(X0, Y0 + NEAR, TURF_TOP).project(persp);
    const rowFull = (1 - v.y) / 2 * FULL;
    const top = rowFull - (ABOVE - NEAR * Math.sin(17 * Math.PI / 180)) * P;
    terrain.update(X0, Y0 + 30, 0, 1000, 0, 0);
    sun.position.set(X0 + 8, Y0 - 6, 20);
    sun.target.position.set(X0, Y0, 0);
    Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60 });
    sun.shadow.camera.updateProjectionMatrix();
    for (let ty = 0; ty < Math.ceil(H / TILE); ty++) for (let tx = 0; tx < Math.ceil(FAR_W / TILE); tx++) {
      r.setSize(TILE, TILE);
      persp.setViewOffset(FULL, FULL, FULL / 2 - FAR_W / 2 + tx * TILE, top + ty * TILE, TILE, TILE);
      r.render(scene, persp);
      tiles.push({ tx, ty, png: r.domElement.toDataURL("image/png") });
    }
    seam.far = rowFull - top;
    return { tiles, W: FAR_W, H, TILE };
  }
  Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22 });
  sun.shadow.camera.updateProjectionMatrix();
  r.setSize(TILE, TILE);
  const half = TILE / 2 / P;
  for (let ty = 0; ty < Math.ceil(H / TILE); ty++) for (let tx = 0; tx < Math.ceil(W / TILE); tx++) {
    const cx = X0 - SPAN + (tx * TILE + TILE / 2) / P;
    const cu = ABOVE - (ty * TILE + TILE / 2) / P; // mm above the feet line on screen
    const target = new THREE.Vector3(cx, Y0, TURF_TOP).addScaledVector(UP, cu);
    ortho.position.copy(target).addScaledVector(DIR, -150);
    ortho.lookAt(target);
    Object.assign(ortho, { left: -half, right: half, top: half, bottom: -half });
    ortho.updateProjectionMatrix();
    terrain.update(cx, Y0, 0, 1000, 0, 0); // finest grass where this tile looks
    sun.position.set(cx + 8, Y0 - 6, 20);
    sun.target.position.set(cx, Y0, 0);
    r.render(scene, ortho);
    tiles.push({ tx, ty, png: r.domElement.toDataURL("image/png") });
  }
  seam.near = ABOVE * P - NEAR * Math.sin(17 * Math.PI / 180) * P;
  return { tiles, W, H, TILE };
};
// Where things are: stage x = 0 at column x0 of the near and front strips (feet line at row
// feetRow) and at column farX0 of the far view; the far view scrolls at `parallax`.
window.meta = () => ({ pxPerMm: P, x0: SPAN * P, feetRow: ABOVE * P, span: SPAN, width: W, height: H,
  farWidth: FAR_W, farX0: FAR_W / 2, parallax: PARALLAX, nearSeamRow: seam.near, farSeamRow: seam.far });
window.ready = true;
</script>
